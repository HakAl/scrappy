# Docker Compose for E2E tests
services:
  e2e:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    container_name: scrappy-e2e
    environment:
      # Disable Langfuse for E2E tests
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    volumes:
      # Mount traces output
      - ./tui-traces:/app/e2e/tui-traces
    tty: true
    stdin_open: true
