[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = False
ignore_missing_imports = True
# Focused change checks pass the touched files explicitly. Do not let those
# checks walk unrelated import graphs; on Windows/Python 3.13, mypy 1.18 can
# finish analysis and then fail to exit when following the wider app graph.
follow_imports = skip
# Allow explicit Any since it's needed for flexible APIs
disallow_any_explicit = False
# Disable strict optional for now (can enable later)
strict_optional = True
# Show error codes for easier debugging
show_error_codes = True
# Allow untyped definitions in third-party modules
disallow_untyped_defs = False

[mypy-tests.*]
ignore_errors = True
