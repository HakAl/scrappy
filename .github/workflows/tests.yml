name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short --ignore=tests/cli/textual/

    # scrappy-6aua DELIVERY GAP. The step above ignores tests/cli/textual/
    # wholesale, so the six rules-composition cases proving PR-7's runtime-owned
    # loader injection were selected by NO matrix job. The broad TUI exclusion is
    # RETAINED above for the ordinary suite; this step adds back only that one
    # file, explicitly, in EVERY matrix job including Windows 3.11/3.12/3.13.
    # Same interpreter and same controlled setup as the step above. No
    # continue-on-error and no deselection, so a failure here FAILS THE JOB.
    - name: Run rules-composition tests (restored from the TUI exclusion)
      run: |
        python -m pytest tests/cli/textual/test_rules_loader_composition.py -v --tb=short

    - name: Run tests with coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        pip install pytest-cov
        python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing --ignore=tests/cli/textual/

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install "ruff==0.15.17" "mypy==2.1.0"

    - name: Run Ruff linter
      # Blocking: src/ and tests/ are lint-clean for E,F,W as of scrappy-1hgx.
      # Pinned so a ruff release cannot change the gate underneath us; bump
      # deliberately.
      run: |
        ruff check src/ tests/ --select=E,F,W --ignore=E501

    - name: Run type checking
      # Config is the single [tool.mypy] source in pyproject.toml; mypy is
      # pinned above so a release cannot change the gate underneath us
      # (scrappy-21x0 PR-M0). Still NON-BLOCKING while the baseline is zeroed;
      # PR-M6 of scrappy-21x0 drops the || true and continue-on-error.
      run: |
        mypy src/ --no-error-summary || true
      continue-on-error: true

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security linter
      run: |
        bandit -r src/ -ll -f json -o bandit-report.json || true
        bandit -r src/ -ll || true
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -e .
        safety check || true
      continue-on-error: true

  contained-linux:
    # THE ONLY JOB IN THIS WORKFLOW THAT VERIFIES CONTAINMENT AT RUNTIME.
    # Every other job runs `python -m pytest` directly, where the positive control
    # SKIPS ITSELF: its pytestmark keys on `.pytest_profile` appearing in Path.home(),
    # which only scripts/contained-pytest.sh establishes. Those jobs therefore prove the
    # tests pass, and say nothing about whether the launcher contains anything.
    name: Contained Linux Positive Control
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build the virtualenv the launcher requires
      # scripts/contained-pytest.sh execs ${REPO_ROOT}/.venv/bin/python BY DESIGN, so it
      # cannot be pointed at the runner's interpreter. The venv is part of the contract.
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -e .[dev]

    - name: Run the positive control THROUGH THE LAUNCHER
      run: |
        ./scripts/contained-pytest.sh tests/containment/test_positive_control.py \
          -p no:randomly -v \
          --junit-xml=.pytest_profile/positive-control/junit.xml

    - name: Require all six positive controls to have EXECUTED and passed
      # A skipped positive control is GREEN to pytest and proves nothing, so the exit
      # code alone cannot gate this. The report is checked for skips, for an absent
      # file, and for a shrunken selection. See scripts/assert_positive_control.py.
      if: always()
      run: |
        .venv/bin/python scripts/assert_positive_control.py \
          .pytest_profile/positive-control/junit.xml
