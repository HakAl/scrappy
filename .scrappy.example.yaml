# Example Scrappy CLI configuration file (YAML format)
# Copy this file to .scrappy.yaml and customize as needed
#
# Config is loaded from (in order of priority):
#   1. File specified in CLI_CONFIG_PATH environment variable
#   2. .scrappy.json, .scrappy.yaml, .scrappy.toml in current directory
#   3. Environment variables with CLI_ prefix (e.g., CLI_TEMPERATURE_DEFAULT=0.8)
#   4. Default values shown below

# Temperature settings for LLM responses
temperature_low: 0.3        # For precise, deterministic responses
temperature_default: 0.7    # Standard temperature for general use

# Token limits
max_tokens_query: 1000      # Max tokens for CLI queries
max_tokens_summary: 2000    # Max tokens for file summaries

# Line limits
max_lines_config: 100       # Max lines when reading config files
max_lines_dependency: 50    # Max lines when reading dependency files
max_test_results: 20        # Max test files to display

# Content truncation thresholds (ordered by size)
truncate_error_message: 500      # Error message truncation
truncate_research_medium: 1000   # Medium research content
truncate_research_large: 1500    # Large research content
truncate_file_content: 2000      # General file content
truncate_priority_file: 3000     # Priority/important files

# String preview lengths
preview_short: 40           # Short preview (e.g., filenames)
preview_standard: 50        # Standard preview length
preview_conclusion: 200     # Conclusion/summary previews

# Rate limit warning thresholds (as percentages, 0.0-1.0)
cache_hit_good: 0.50        # Good cache hit rate (50%)
rate_limit_warning: 0.75    # Warning threshold (75%)
rate_limit_critical: 0.90   # Critical threshold (90%)

# Display settings
max_display_messages: 4     # Max messages to display in UI
progress_bar_width: 20      # Width of progress bars
dashboard_enabled: true     # Enable live dashboard display
dashboard_refresh_rate: 4   # Dashboard refresh rate (updates per second)

# Separator widths for console output
separator_width_narrow: 40   # Narrow separators
separator_width_standard: 50 # Standard separators
separator_width_wide: 60     # Wide separators

# Command defaults
max_iterations: 10          # Max iterations for iterative commands

# Clarification settings
# Controls when user clarification is requested for ambiguous tasks
clarification:
  confidence_threshold: 0.7      # Below this, always clarify
  high_confidence_bypass: 0.9    # Above this, skip conflicting signal checks

# Theme configuration
# Controls colors for CLI and TUI output
theme:
  # Use a preset theme: "dark" (default) or "light"
  preset: dark

  # Override individual colors (optional):
  # primary: cyan          # Borders, headers, labels, info text
  # accent: yellow         # Commands, keywords, interactive elements
  # success: green         # Enabled states, completions, positive values
  # warning: yellow        # Caution states
  # error: red             # Errors, disabled, negative states
  # info: blue             # Informational panels, thinking state
  # text: white            # Normal text
  # text_muted: bright_black  # Dimmed/secondary text
  # surface: "#1e1e1e"     # Main background (TUI only)
  # surface_alt: "#2d2d2d" # Panels, status bar (TUI only)

# Example: One Dark theme
# theme:
#   preset: dark
#   primary: "#61afef"
#   accent: "#e5c07b"
#   success: "#98c379"
#   error: "#e06c75"
#   info: "#56b6c2"
#   text: "#abb2bf"
#   text_muted: "#5c6370"
#   surface: "#282c34"
#   surface_alt: "#3e4451"

# You can also specify environment-specific configs:
# development:
#   temperature_default: 0.9
#   dashboard_enabled: true
#
# production:
#   temperature_default: 0.7
#   dashboard_enabled: false
