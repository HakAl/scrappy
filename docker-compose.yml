# Docker Compose for Scrappy development services
# Langfuse for observability (self-hosted, free)

services:
  # PostgreSQL database for Langfuse
  langfuse-db:
    image: postgres:15-alpine
    container_name: scrappy-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Langfuse server for tracing and observability
  langfuse:
    # v2 only needs PostgreSQL; v3 requires ClickHouse (more complex)
    # Check https://hub.docker.com/r/langfuse/langfuse/tags for available versions
    image: langfuse/langfuse:2
    container_name: scrappy-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # NETWORK EXPOSURE: Port 3000 exposes the Langfuse web UI.
      # - For local dev: accessible at http://localhost:3000
      # - For production: Use reverse proxy (nginx/traefik) with TLS
      # - Contains traces with potentially sensitive data - restrict access appropriately
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      # SECURITY: These MUST be set via environment variables in production
      # For local dev, set LANGFUSE_NEXTAUTH_SECRET and LANGFUSE_SALT in your shell
      # or create a .env file (not committed to git)
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-secret-do-not-use-in-production}
      SALT: ${LANGFUSE_SALT:-dev-salt-do-not-use-in-production}
      TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_SIGN_UP_DISABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  langfuse-db-data:
