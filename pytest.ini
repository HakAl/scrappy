[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -m "not benchmark and not slow"
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use external services)
    slow: Slow running tests
    requires_api: Tests that require API keys
    benchmark: Expensive benchmark tests (deselected by default, run with: pytest -m benchmark)
